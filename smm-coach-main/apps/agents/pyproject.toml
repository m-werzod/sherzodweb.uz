[project]
name = "smm-agents"
version = "0.0.1"
description = "SMM AI agent orchestration service — FastAPI + LangGraph"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # LangGraph + LLM SDKs
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.10",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.5",
    "anthropic>=0.50.0",
    "google-genai>=0.4.0",
    # Database / cache
    "asyncpg>=0.30.0",
    "psycopg[binary,pool]>=3.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "redis[hiredis]>=5.2.0",
    "pgvector>=0.3.6",
    # HTTP / data
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "orjson>=3.10.12",
    # Object storage — montage worker pulls the user upload + pushes the render
    # to the same MinIO bucket the web writes to (apps/agents/app/montage/storage.py).
    "boto3>=1.35.0",
    # Observability
    "langfuse>=2.55.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.19.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    # Misc
    "python-dotenv>=1.0.1",
    "cryptography>=44.0.0",
    # Instagram data layer — instagrapi (primary mobile-API) + Playwright (fallback)
    # 2.8.x adds handling for more of Instagram's newer challenge flows.
    "instagrapi>=2.8.21",
    "playwright>=1.49.0",
    "playwright-stealth>=2.0.0",
    "fake-useragent>=2.0.3",
    # Real Chrome TLS/JA3 fingerprint for IG JSON calls — a naked httpx handshake
    # is flagged as a bot and 403'd. Optional at runtime (httpx fallback).
    "curl-cffi>=0.7.0",
    "prometheus-client>=0.21.0",
    "fal-client>=1.0.0",
    "langchain>=1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "mypy>=1.13.0",
    "ruff>=0.8.4",
    "types-redis>=4.6.0.20241004",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RET", "SIM", "TCH"]
ignore = [
    "E501",   # line length (formatter handles it)
    "S101",   # assert allowed in tests
    "B008",   # FastAPI Depends() in defaults
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_any_unimported = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
